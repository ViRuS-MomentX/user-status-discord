# Время в логе: без него непонятно, когда что произошло.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showShortLogName=true

org.slf4j.simpleLogger.defaultLogLevel=info

# Раньше этот логгер был приглушён как шумный, но его повторы — единственный
# признак того, что голосовое соединение пересоздаётся по кругу. Пока причина
# разрывов не выяснена, он должен быть виден.
org.slf4j.simpleLogger.log.net.dv8tion.jda.internal.audio.AudioWebSocket=warn
