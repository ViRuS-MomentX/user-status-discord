name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Бот и V.I.R.U.S. собираются по отдельности: у каждого свой pom
        module: [bot, manager]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      # Java 25 — как и для запуска: без неё не соберётся шифрование голоса
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Сборка и тесты
        run: mvn -B package
