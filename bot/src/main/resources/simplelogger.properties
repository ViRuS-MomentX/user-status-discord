# Время в логе: без него непонятно, когда что произошло.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss
org.slf4j.simpleLogger.showShortLogName=true

org.slf4j.simpleLogger.defaultLogLevel=info

# JDA повторяет это предупреждение о шифровании голоса десятки раз подряд,
# засыпая лог одинаковыми строками. Оставляем от него только ошибки.
org.slf4j.simpleLogger.log.net.dv8tion.jda.internal.audio.AudioWebSocket=error
